name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: npm ci

      - name: PHP code style (Pint)
        run: vendor/bin/pint --test

      - name: JavaScript (ESLint)
        run: npm run lint

  format:
    name: Prettier
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate app key
        run: php artisan key:generate

      - name: Install JS dependencies
        run: npm ci

      # The views load the Vite manifest, so assets must be built before the tests run.
      - name: Build assets
        run: npm run build

      # phpunit.xml points the tests at an in-memory SQLite database.
      - name: Run tests
        run: php artisan test

  # Merges Dependabot's patch and minor updates once every check above has passed.
  automerge:
    name: Auto-merge Dependabot
    needs: [lint, format, tests]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Read update details
        id: metadata
        uses: dependabot/fetch-metadata@v2

      - name: Merge patch and minor updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
